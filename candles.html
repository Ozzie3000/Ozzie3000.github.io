<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candles — reusable CSS flames — Oz</title>
<meta property="og:title" content="Candles — reusable CSS flames — Oz">
<meta property="og:description" content="A reusable pure-CSS candle flame by Oz. Click the scene to light more candles.">
<meta property="og:image" content="https://ozzie3000.github.io/images/candle-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://ozzie3000.github.io/candles.html">
<meta property="og:type" content="website">
<meta name="author" content="Oz">

<link rel="stylesheet" href="stylesheets/candle.css">
<style>
  /* Page chrome only — the candle itself lives entirely in candle.css. */
  html, body { margin: 0; height: 100%; }
  body {
    background: #000;
    color: #e7d9a6;
    font-family: Monaco, Consolas, "Courier New", monospace;
    overflow: hidden;
  }

  .candle-stage {
    position: relative;      /* candles are absolutely placed inside this */
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
    background: radial-gradient(120% 90% at 50% 100%, #211603 0%, #0a0700 55%, #000 100%);
  }

  /* A simple mantel the candles sit on. */
  .mantel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 9%;
    background: linear-gradient(180deg, #2a1d0c, #160f06);
    box-shadow: 0 -6px 24px rgba(0, 0, 0, .6), inset 0 2px 0 rgba(255, 200, 120, .12);
    z-index: 2;
  }

  .overlay { position: absolute; left: 0; right: 0; top: 0; z-index: 3; text-align: center;
             padding: 22px 16px; pointer-events: none; }
  .overlay h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: 1px;
                color: #ffcf73; text-shadow: 0 0 18px rgba(255, 160, 40, .35); }
  .overlay p  { margin: 8px 0 0; font-size: 13px; color: #9a8a5d; }

  /* Swatch row + buttons live inside the (centered) overlay, stacked
     under the title. The overlay is click-through, so re-enable pointers. */
  .swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px;
              max-width: 380px; margin: 16px auto 0; pointer-events: auto; }
  .swatch {
    width: 24px; height: 24px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, .2); background-clip: padding-box;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.selected { border-color: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .55);
                     transform: scale(1.15); }
  .swatch.random { background: conic-gradient(from 0deg,
      #fa8763, #ffb347, #9dff7a, #5ff0e0, #63b8fa, #c77bff, #ff8ad6, #fa8763); }

  .controls { display: flex; justify-content: center; gap: 14px;
              margin: 14px auto 0; pointer-events: auto; }
  .controls button {
    font-family: inherit; font-size: 12px; cursor: pointer;
    color: #ffcf73; background: rgba(0, 0, 0, .45);
    border: 1px solid rgba(255, 180, 80, .4); border-radius: 6px; padding: 7px 12px;
  }
  .controls button:hover { background: rgba(255, 180, 80, .15); }

  .hint { position: absolute; left: 0; right: 0; bottom: 11%; z-index: 3; text-align: center;
          font-size: 12px; color: #8a7a50; pointer-events: none; }
</style>
</head>
<body>

  <div class="candle-stage" id="stage">
    <div class="overlay">
      <h1>Candles</h1>
      <p>A reusable pure-CSS flame &mdash; one stylesheet, one tiny spawner.</p>
      <div class="swatches" id="swatches"></div>
      <div class="controls">
        <button id="add">Add candle</button>
        <button id="clear">Clear</button>
      </div>
    </div>

    <div class="hint">Click anywhere to light a candle</div>
    <div class="mantel"></div>
  </div>

  <script src="javascripts/candle.js"></script>
  <script>
    var stage = document.getElementById("stage");

    // Flame palettes. Pick one from the swatch row, or leave it on Random.
    var PALETTE = [
      { name: "Classic", flame: "#fa8763", flameBase: "#761b00", wax: "#ca9800" },
      { name: "Amber",   flame: "#ffb347", flameBase: "#7a2e00", wax: "#b8860b" },
      { name: "Ember",   flame: "#ff7676", flameBase: "#6e1414", wax: "#a8431e" },
      { name: "Spirit",  flame: "#63b8fa", flameBase: "#002a76", wax: "#1e5fa8" },
      { name: "Wisp",    flame: "#9dff7a", flameBase: "#0a4d00", wax: "#3a7d1f" },
      { name: "Ghost",   flame: "#ffffff", flameBase: "#5a5a5a", wax: "#cfcfcf" },
      { name: "Hex",     flame: "#c77bff", flameBase: "#2a0050", wax: "#6a3aa8" },
      { name: "Frost",   flame: "#5ff0e0", flameBase: "#00484a", wax: "#1f8a8a" },
      { name: "Rose",    flame: "#ff8ad6", flameBase: "#5a0040", wax: "#a83a86" }
    ];

    var selected = null; // null = random colour for the next candle

    // The .candle is a 400px-wide box with the visible flame centred inside,
    // but `left` positions the box's left edge. Shift by half the box width so
    // the x we pass is the candle's centre (keeps taps under the finger and
    // the opening row on-screen, which matters on narrow phones).
    var CANDLE_HALF = 200;

    function rand(a, b) { return a + Math.random() * (b - a); }

    // Place a candle so its base sits on the mantel, centred at horizontal x (px).
    function lightCandle(xPx, theme) {
      var t = theme ||
        (selected != null ? PALETTE[selected]
                          : PALETTE[Math.floor(Math.random() * PALETTE.length)]);
      Candle.create(stage, {
        scale: rand(0.45, 0.95),
        left: (xPx - CANDLE_HALF) + "px",
        bottom: rand(7, 11) + "%",   // rest on / just above the mantel
        count: 110,
        flame: t.flame, flameBase: t.flameBase, wax: t.wax
      });
    }

    /* ---- Swatch row: choose the next candle's flame colour ---------- */
    var swatchRow = document.getElementById("swatches");

    function selectSwatch(btn) {
      var all = swatchRow.querySelectorAll(".swatch");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("selected");
      btn.classList.add("selected");
    }

    function addSwatch(label, cls, bg, onPick) {
      var b = document.createElement("button");
      b.className = "swatch" + (cls ? " " + cls : "");
      b.title = label;
      b.setAttribute("aria-label", label);
      if (bg) b.style.background = bg;
      b.addEventListener("click", function () { onPick(); selectSwatch(b); });
      swatchRow.appendChild(b);
      return b;
    }

    // "Random" first, selected by default.
    var randomSwatch = addSwatch("Random colour", "random", "", function () { selected = null; });
    selectSwatch(randomSwatch);

    // One swatch per palette colour (mini flame: glow centre over the base).
    for (var p = 0; p < PALETTE.length; p++) {
      (function (i) {
        var c = PALETTE[i];
        var bg = "radial-gradient(circle at 50% 35%, " + c.flame + ", " + c.flameBase + ")";
        addSwatch(c.name, "", bg, function () { selected = i; });
      })(p);
    }

    // Opening scene: a little row of candles.
    var w = stage.clientWidth;
    lightCandle(w * 0.50, PALETTE[0]);
    lightCandle(w * 0.24, PALETTE[1]);
    lightCandle(w * 0.74, PALETTE[2]);
    lightCandle(w * 0.86, PALETTE[3]);

    // Click the scene to light a candle where you clicked.
    stage.addEventListener("click", function (e) {
      // Ignore clicks on the swatch row / control buttons.
      if (e.target.closest(".controls") || e.target.closest(".swatches")) return;
      lightCandle(e.clientX);
    });

    document.getElementById("add").addEventListener("click", function () {
      lightCandle(rand(stage.clientWidth * 0.1, stage.clientWidth * 0.9));
    });
    document.getElementById("clear").addEventListener("click", function () {
      var all = stage.querySelectorAll(".candle");
      for (var i = 0; i < all.length; i++) all[i].remove();
    });
  </script>
  <script src="js/copyright.js"></script>
</body>
</html>
