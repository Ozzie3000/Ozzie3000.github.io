	var ceiling;
	var randoNum;

	function picker(){
		ceiling = parseInt(prompt("Pick the highest possible number it could be. Only use whole numbers"));
	}

	function numberz(){
		if(isNaN(ceiling)){
			document.getElementById("here0").innerHTML = "Pick the end range first (button 1).";
			return;
		}
		randoNum = Math.floor(Math.random()*(ceiling+1));
		// clear any messages from a previous round
		document.getElementById("here0").innerHTML = "&nbsp;";
		document.getElementById("here1").innerHTML = "&nbsp;";
		document.getElementById("here2").innerHTML = "&nbsp;";
		document.getElementById("here3").innerHTML = "&nbsp;";
		for (var i=0; i<3; i++){
			var guessA = parseInt(prompt("Guess a number 0 - "+ceiling));
			// clear previous guess's hints
			document.getElementById("here2").innerHTML = "&nbsp;";
			document.getElementById("here3").innerHTML = "&nbsp;";
			if(isNaN(guessA)){
				document.getElementById("here1").innerHTML = "Please pick a number";
				i--; // don't count an invalid/cancelled entry as a guess
				continue;
			}
			if(guessA > randoNum){
				document.getElementById("here3").innerHTML = "Nope: "+guessA+" is too high. Go lower.";
			}
			if(guessA < randoNum){
				document.getElementById("here2").innerHTML = "Nope: "+guessA+" is too low. Go higher.";
			}
			if(guessA == randoNum){
				document.getElementById("here1").innerHTML = "Dude you are the man! "+randoNum+" was correct";
				break;
			}
		}
	//	alert(randoNum + " was the real number.");
	}

	function realNo(){
		alert(randoNum + " was the real number.");
	}
</script>

		<li>You will get 3 guesses</li>
		<li>If you don't get it in 3 guesses try again.</li>
	</ol>

	<input type="button" value="2) Start!" onclick="numberz();" id="b2" class="btn"/>
	<input type="button" value="3) what is the rando number" onclick="realNo();" id="b3" class="btn" />
