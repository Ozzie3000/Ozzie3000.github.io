<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Guessing game brought to you by Oz">
<meta property="og:description" content="Oz works on Web Dev mini projects by Oz. Using HTML, Javascript, CSS">
<meta property="og:image" content="https://ozzie3000.github.io/images/oz.png">
<meta property="og:url" content="https://ozzie3000.github.io/guessing_game.html">
<meta property="og:type" content="website">
<meta name="author" content="Oz">
<!-- Twitter/X specifically uses these -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ozzie3000.github.io/images/oz.png">
<title>Guessing game brought to you by Oz</title>
<style>
  :root{
    --bg1:#1e1b4b;
    --bg2:#4c1d95;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --accent:#6d28d9;
    --accent-dark:#5b21b6;
    --ok:#059669;
    --err:#dc2626;
    --warn:#d97706;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    background:var(--card);
    width:100%;
    max-width:560px;
    border-radius:20px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);
    padding:32px 32px 28px;
  }
  h1{
    margin:0 0 4px;
    font-size:30px;
    letter-spacing:-.5px;
  }
  .sub{
    margin:0 0 18px;
    color:var(--muted);
    font-size:15px;
  }
  .hud{
    display:flex;
    gap:12px;
    margin-bottom:20px;
  }
  .stat{
    flex:1;
    background:#f5f3ff;
    border:1px solid #ede9fe;
    border-radius:14px;
    padding:10px 12px;
    text-align:center;
  }
  .stat .num{
    font-size:24px;
    font-weight:800;
    line-height:1.1;
  }
  .stat .lab{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-top:2px;
  }
  .stat.wins .num{color:var(--ok);}
  .stat.losses .num{color:var(--err);}
  .stat.timer{background:#eef2ff;border-color:#e0e7ff;}
  .stat.timer .num{color:var(--accent);font-variant-numeric:tabular-nums;}
  .stat.timer.warn{background:#fffbeb;border-color:#fde68a;}
  .stat.timer.warn .num{color:var(--warn);}
  .stat.timer.danger{background:#fef2f2;border-color:#fecaca;}
  .stat.timer.danger .num{color:var(--err);animation:pulse .6s ease-in-out infinite;}
  .stat.timer .lab .turnlabel{display:block;color:var(--accent);font-weight:700;}
  @keyframes pulse{50%{opacity:.45;}}
  .instructions{
    background:#f5f3ff;
    border:1px solid #ede9fe;
    border-radius:12px;
    padding:12px 16px 12px 32px;
    margin:0 0 24px;
    font-size:14px;
    color:#4b3f72;
  }
  .instructions li{margin:3px 0;}
  .row{
    margin-bottom:18px;
    opacity:1;
    transition:opacity .25s ease;
  }
  .row.locked{opacity:.45;}
  .row label{
    display:block;
    font-weight:600;
    font-size:14px;
    margin-bottom:6px;
  }
  .controls{display:flex;gap:10px;}
  input[type="number"]{
    flex:1;
    font-size:18px;
    padding:11px 14px;
    border:2px solid var(--line);
    border-radius:12px;
    outline:none;
    transition:border-color .15s ease;
    width:100%;
    -moz-appearance:textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type="number"]:focus{border-color:var(--accent);}
  input[type="number"]:disabled{background:#f9fafb;color:#9ca3af;}
  button{
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:12px;
    padding:11px 18px;
    cursor:pointer;
    color:#fff;
    background:var(--accent);
    transition:background .15s ease,transform .05s ease;
    white-space:nowrap;
  }
  button:hover:not(:disabled){background:var(--accent-dark);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{background:#c4b5fd;cursor:not-allowed;}
  .feedback{
    min-height:18px;
    margin-top:7px;
    font-size:14px;
    font-weight:600;
  }
  .feedback.err{color:var(--err);}
  .feedback.low,.feedback.high{color:var(--warn);}
  .feedback.ok{color:var(--ok);}
  .banner{
    margin-top:8px;
    padding:16px;
    border-radius:14px;
    text-align:center;
    font-size:18px;
    font-weight:700;
    display:none;
  }
  .banner.win{background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0;display:block;}
  .banner.lose{background:#fef2f2;color:var(--err);border:1px solid #fecaca;display:block;}
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .ghost{
    background:transparent;
    color:var(--accent);
    border:2px solid var(--accent);
    padding:9px 16px;
  }
  .ghost:hover:not(:disabled){background:#f5f3ff;}
  #playAgain{display:none;}
  .hidden{display:none !important;}
</style>
</head>
<body>
  <div class="card">
    <h1>The Guessing Game</h1>
    <p class="sub">Pick a range, then crack the secret number in 3 guesses &mdash; 60 seconds per turn.</p>

    <div class="hud">
      <div class="stat wins"><div class="num" id="wins">0</div><div class="lab">Wins</div></div>
      <div class="stat losses"><div class="num" id="losses">0</div><div class="lab">Losses</div></div>
      <div class="stat timer" id="timerBox">
        <div class="num" id="timer">2:00</div>
        <div class="lab"><span class="turnlabel" id="turnLabel">Ready</span>time left</div>
      </div>
    </div>

    <ol class="instructions">
      <li>Set the top of the range (you pick the ceiling).</li>
      <li>You get 3 guesses between 1 and your ceiling.</li>
      <li>Each guess tells you too high or too low. Good luck!</li>
    </ol>

    <!-- Ceiling -->
    <div class="row" id="row-ceiling">
      <label for="ceiling">Step 1 &mdash; Pick the highest possible number</label>
      <div class="controls">
        <input type="number" id="ceiling" placeholder="e.g. 100" min="1" step="1">
        <button id="setRange">Set range</button>
      </div>
      <div class="feedback" id="fb-ceiling"></div>
    </div>

    <!-- Guesses (revealed one at a time) -->
    <div class="row locked hidden" id="row-g1">
      <label for="g1">Guess 1</label>
      <div class="controls">
        <input type="number" id="g1" min="1" step="1" disabled>
        <button id="btn-g1" disabled>Guess</button>
      </div>
      <div class="feedback" id="fb-g1"></div>
    </div>

    <div class="row locked hidden" id="row-g2">
      <label for="g2">Guess 2</label>
      <div class="controls">
        <input type="number" id="g2" min="1" step="1" disabled>
        <button id="btn-g2" disabled>Guess</button>
      </div>
      <div class="feedback" id="fb-g2"></div>
    </div>

    <div class="row locked hidden" id="row-g3">
      <label for="g3">Guess 3</label>
      <div class="controls">
        <input type="number" id="g3" min="1" step="1" disabled>
        <button id="btn-g3" disabled>Guess</button>
      </div>
      <div class="feedback" id="fb-g3"></div>
    </div>

    <div class="banner" id="banner"></div>

    <div class="footer">
      <button class="ghost" id="playAgain">Play again</button>
      <button class="ghost" id="resetStats">Reset stats</button>
    </div>
  </div>

<script>
(function(){
  var TURN_SECONDS = 60;
  var CEILING_SECONDS = 120;
  var STORAGE_KEY = "oz_guessing_game_stats";

  var ceiling = null;
  var secret = null;
  var gameOver = false;

  // timer state
  var timerId = null;
  var deadline = 0;
  var currentPhase = null; // "ceiling" | 1 | 2 | 3

  var ceilingInput = document.getElementById("ceiling");
  var setRangeBtn  = document.getElementById("setRange");
  var fbCeiling    = document.getElementById("fb-ceiling");
  var playAgainBtn = document.getElementById("playAgain");
  var resetStatsBtn= document.getElementById("resetStats");
  var banner       = document.getElementById("banner");

  var winsEl   = document.getElementById("wins");
  var lossesEl = document.getElementById("losses");
  var timerEl  = document.getElementById("timer");
  var timerBox = document.getElementById("timerBox");
  var turnLabel= document.getElementById("turnLabel");

  // ---- scoreboard (persisted) ----
  var stats = {wins:0, losses:0};
  function loadStats(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && typeof p.wins === "number" && typeof p.losses === "number") stats = p;
      }
    }catch(e){ /* storage unavailable; keep in-memory */ }
    renderStats();
  }
  function saveStats(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }catch(e){}
  }
  function renderStats(){
    winsEl.textContent = stats.wins;
    lossesEl.textContent = stats.losses;
  }

  // ---- timer ----
  function fmt(sec){
    var m = Math.floor(sec/60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }
  function paintTimer(remaining){
    timerEl.textContent = fmt(remaining);
    timerBox.classList.remove("warn","danger");
    if(remaining <= 5) timerBox.classList.add("danger");
    else if(remaining <= 15) timerBox.classList.add("warn");
  }
  function stopTimer(){
    if(timerId){ clearInterval(timerId); timerId = null; }
  }
  function startTimer(phase, labelText){
    stopTimer();
    currentPhase = phase;
    turnLabel.textContent = labelText;
    var secs = (phase === "ceiling") ? CEILING_SECONDS : TURN_SECONDS;
    deadline = Date.now() + secs * 1000;
    paintTimer(secs);
    timerId = setInterval(function(){
      var remaining = Math.round((deadline - Date.now()) / 1000);
      if(remaining <= 0){
        paintTimer(0);
        stopTimer();
        handleTimeout(phase);
        return;
      }
      paintTimer(remaining);
    }, 200);
  }
  function freezeTimerDisplay(text){
    stopTimer();
    timerBox.classList.remove("warn","danger");
    timerEl.textContent = text;
    turnLabel.textContent = "—";
  }
  function handleTimeout(phase){
    if(gameOver) return;
    if(phase === "ceiling"){
      setFeedback(fbCeiling, "Time's up — you didn't set a range.", "err");
      ceilingInput.disabled = true;
      setRangeBtn.disabled = true;
      endGame(false);
      return;
    }
    // a guess turn ran out -> forfeit that guess
    var fb = document.getElementById("fb-g" + phase);
    lockGuess(phase);
    setFeedback(fb, "Time's up — guess forfeited.", "err");
    if(phase < 3){
      revealGuess(phase + 1);
      startTimer(phase + 1, "Guess " + (phase + 1));
    } else {
      endGame(false);
    }
  }

  // raw string -> positive whole integer, or null if invalid
  function parseWholePositive(raw){
    if(raw === null) return null;
    raw = String(raw).trim();
    if(!/^\d+$/.test(raw)) return null;   // digits only: no decimals, signs, spaces, letters
    var n = parseInt(raw, 10);
    if(n <= 0) return null;
    return n;
  }

  function setFeedback(el, msg, cls){
    el.textContent = msg;
    el.className = "feedback" + (cls ? " " + cls : "");
  }

  // ---- Step 1: ceiling ----
  function setRange(){
    var n = parseWholePositive(ceilingInput.value);
    if(n === null){
      setFeedback(fbCeiling, "Enter a whole number greater than 0.", "err");
      return;
    }
    if(n < 2){
      setFeedback(fbCeiling, "Pick at least 2 so there's something to guess.", "err");
      return;
    }
    ceiling = n;
    secret = Math.floor(Math.random() * ceiling) + 1; // 1..ceiling inclusive
    setFeedback(fbCeiling, "Range set: 1 to " + ceiling + ". Start guessing!", "ok");
    ceilingInput.disabled = true;
    setRangeBtn.disabled = true;
    revealGuess(1);
    startTimer(1, "Guess 1");
  }

  // ---- Guess rows ----
  function revealGuess(i){
    var row = document.getElementById("row-g" + i);
    var input = document.getElementById("g" + i);
    var btn = document.getElementById("btn-g" + i);
    row.classList.remove("hidden", "locked");
    input.disabled = false;
    btn.disabled = false;
    input.focus();
  }

  function lockGuess(i){
    document.getElementById("g" + i).disabled = true;
    document.getElementById("btn-g" + i).disabled = true;
  }

  function endGame(win){
    if(gameOver) return;
    gameOver = true;
    stopTimer();
    freezeTimerDisplay(win ? "Win!" : "—");
    for(var i = 1; i <= 3; i++) lockGuess(i);
    if(win){ stats.wins++; } else { stats.losses++; }
    saveStats();
    renderStats();
    banner.className = "banner " + (win ? "win" : "lose");
    banner.textContent = win
      ? "You got it! The number was " + secret + "."
      : "Out of guesses. The number was " + secret + ".";
    playAgainBtn.style.display = "inline-block";
  }

  function handleGuess(i){
    var input = document.getElementById("g" + i);
    var fb = document.getElementById("fb-g" + i);
    var n = parseWholePositive(input.value);

    if(n === null){
      setFeedback(fb, "Enter a whole number greater than 0.", "err");
      return;
    }
    if(n > ceiling){
      setFeedback(fb, "Must be " + ceiling + " or less.", "err");
      return;
    }

    // valid guess -> lock this box, give feedback
    lockGuess(i);

    if(n === secret){
      setFeedback(fb, "Correct — " + n + " is the number!", "ok");
      endGame(true);
      return;
    }

    if(n < secret){
      setFeedback(fb, n + " is too low. Go higher.", "low");
    } else {
      setFeedback(fb, n + " is too high. Go lower.", "high");
    }

    if(i < 3){
      revealGuess(i + 1);
      startTimer(i + 1, "Guess " + (i + 1));
    } else {
      endGame(false);
    }
  }

  // ---- reset (new round; keeps scoreboard) ----
  function reset(){
    stopTimer();
    ceiling = null; secret = null; gameOver = false;
    ceilingInput.disabled = false;
    ceilingInput.value = "";
    setRangeBtn.disabled = false;
    setFeedback(fbCeiling, "", "");
    for(var i = 1; i <= 3; i++){
      var row = document.getElementById("row-g" + i);
      var input = document.getElementById("g" + i);
      input.value = "";
      input.disabled = true;
      document.getElementById("btn-g" + i).disabled = true;
      setFeedback(document.getElementById("fb-g" + i), "", "");
      row.classList.add("locked", "hidden");
    }
    banner.className = "banner";
    banner.textContent = "";
    playAgainBtn.style.display = "none";
    ceilingInput.focus();
    startTimer("ceiling", "Set range");
  }

  // ---- wire up ----
  setRangeBtn.addEventListener("click", setRange);
  ceilingInput.addEventListener("keydown", function(e){ if(e.key === "Enter") setRange(); });

  for(var i = 1; i <= 3; i++){
    (function(idx){
      document.getElementById("btn-g" + idx).addEventListener("click", function(){ handleGuess(idx); });
      document.getElementById("g" + idx).addEventListener("keydown", function(e){
        if(e.key === "Enter" && !this.disabled) handleGuess(idx);
      });
    })(i);
  }

  playAgainBtn.addEventListener("click", reset);
  resetStatsBtn.addEventListener("click", function(){
    stats = {wins:0, losses:0};
    saveStats();
    renderStats();
  });

  // ---- boot ----
  loadStats();
  startTimer("ceiling", "Set range");
})();
</script>
</body>
</html>
